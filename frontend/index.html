<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxbd4UrNiffdFaTLiTIZ_ZsmDE6Y_feTu8FqE-PTK-wQ&s=10"
            alt="Icono de burger" width="70">
        <img src="https://w7.pngwing.com/pngs/936/468/png-transparent-youtube-logo-youtube-logo-computer-icons-subscribe-angle-rectangle-airplane-thumbnail.png"
            alt="Logo de YouTube" width="120">

        <h1>YouTube</h1>
    </header>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#videos">Videos</a>
    </nav>

    <aside>
        <h2>Menú</h2>

        <a href="#inicio">Inicio</a>
        <a href="#videos">Videos</a>

        <h2>Categorías</h2>

        <div class="categorias">
            <button class="activo" data-categoria="">Todos</button>
        </div>
    </aside>

    <main>

        <section id="videos" class="videos">

            <h2>Videos</h2>

            <div class="galeria"></div>

        </section>

    </main>

    <script>
        const API_URL = "http://localhost:8000"
        const fotoPerfil = "https://img.magnific.com/vector-premium/ilustracion-plana-vectorial-escala-grises-icono-perfil-usuario-avatar-persona-imagen-perfil-silueta-genero-neutral-apto-perfiles-redes-sociales-iconos-protectores-pantalla-como-plantillax9xa_719432-2210.jpg?semt=ais_hybrid&w=740&q=80"

        const galeria = document.querySelector(".galeria")
        const divCategorias = document.querySelector(".categorias")

        const cargarVideos = (categoria) => {
            fetch(`${API_URL}/videos/?categoria=${categoria}`)
                .then(res => res.json())
                .then(videos => {
                    galeria.textContent = ""

                    videos.forEach(video => {
                        const card = document.createElement("article")
                        const enlace = document.createElement("a")
                        const videoContainer = document.createElement("video")
                        const videoTitulo = document.createElement("h3")
                        const informacion = document.createElement("div")
                        const perfil = document.createElement("img")
                        const texto = document.createElement("p")

                        card.className = "video"
                        enlace.href = `video.html?id=${video.id}`

                        videoContainer.src = video.source
                        videoContainer.poster = video.miniatura
                        videoContainer.preload = "none"

                        videoTitulo.textContent = video.titulo

                        informacion.className = "informacion-video"
                        perfil.className = "perfil-pequeno"
                        perfil.src = fotoPerfil
                        perfil.alt = "Foto del canal"

                        texto.textContent = `${video.canal} - ${video.vistas} vistas - ${video.likes} likes`

                        enlace.appendChild(videoContainer)
                        enlace.appendChild(videoTitulo)
                        informacion.appendChild(perfil)
                        informacion.appendChild(texto)
                        card.appendChild(enlace)
                        card.appendChild(informacion)

                        galeria.appendChild(card)
                    })
                })
        }

        fetch(`${API_URL}/videos/categorias`)
            .then(res => res.json())
            .then(categorias => {
                categorias.forEach(categoria => {
                    const boton = document.createElement("button")
                    boton.textContent = categoria
                    boton.dataset.categoria = categoria
                    divCategorias.appendChild(boton)
                })
            })

        divCategorias.addEventListener("click", (evento) => {
            if (evento.target.tagName === "BUTTON") {
                divCategorias.querySelectorAll("button").forEach(boton => boton.classList.remove("activo"))
                evento.target.classList.add("activo")
                cargarVideos(evento.target.dataset.categoria)
            }
        })

        cargarVideos("")
    </script>
</body>

</html>
